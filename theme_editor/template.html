<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>canim theme editor</title>
<style>
  :root {
    --ui-bg: #14151a;
    --ui-panel: #1b1d24;
    --ui-line: #2a2d38;
    --ui-text: #c9ced9;
    --ui-dim: #7d8494;
    --mono: Monaco, Menlo, "SF Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ui-bg);
    color: var(--ui-text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--ui-line);
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  header .note { color: var(--ui-dim); font-size: 12px; }

  .app { display: flex; align-items: flex-start; gap: 0; }
  .controls {
    width: 330px;
    flex: none;
    padding: 18px 20px 40px;
    border-right: 1px solid var(--ui-line);
    height: calc(100vh - 52px);
    overflow-y: auto;
  }
  .preview { flex: 1; min-width: 0; padding: 22px 26px 60px; }

  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 12px; color: var(--ui-dim); margin-bottom: 4px; }
  select, input[type=text] {
    width: 100%;
    padding: 7px 9px;
    background: var(--ui-panel);
    color: var(--ui-text);
    border: 1px solid var(--ui-line);
    border-radius: 6px;
    font: inherit;
  }
  h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--ui-dim);
    margin: 24px 0 10px;
    font-weight: 600;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 0;
  }
  .row.hit { outline: 1px solid var(--ui-dim); outline-offset: 3px; border-radius: 4px; }
  .row input[type=color] {
    width: 34px; height: 26px; flex: none; padding: 0;
    background: none; border: 1px solid var(--ui-line); border-radius: 5px;
    cursor: pointer;
  }
  .row .name { flex: 1; font-family: var(--mono); font-size: 12.5px; }
  .row .hex {
    width: 82px; flex: none; font-family: var(--mono); font-size: 12px;
    padding: 4px 6px; background: var(--ui-panel); color: var(--ui-text);
    border: 1px solid var(--ui-line); border-radius: 5px;
  }
  .row .hex.derived { color: var(--ui-dim); font-style: italic; }
  .row button.reset {
    flex: none; width: 22px; height: 22px; padding: 0; line-height: 1;
    background: none; color: var(--ui-dim); border: none; cursor: pointer;
    font-size: 15px; visibility: hidden;
  }
  .row.pinned button.reset { visibility: visible; }

  .actions { margin-top: 26px; display: flex; gap: 8px; }
  button.action {
    padding: 8px 14px; border-radius: 6px; cursor: pointer; font: inherit;
    background: var(--ui-panel); color: var(--ui-text); border: 1px solid var(--ui-line);
  }
  button.action:hover { border-color: var(--ui-dim); }
  button.action.primary { background: #2b3550; border-color: #3d4a6d; }

  textarea#out {
    width: 100%; height: 250px; margin-top: 12px; padding: 10px;
    background: var(--ui-panel); color: var(--ui-text);
    border: 1px solid var(--ui-line); border-radius: 6px;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.45;
    white-space: pre; overflow: auto;
  }

  /* --- the part being themed ------------------------------------------- */

  .stage {
    background: var(--bg);
    border-radius: 10px;
    padding: 22px 24px;
    border: 1px solid rgba(255,255,255,.05);
  }
  .sample + .sample { margin-top: 26px; }
  .sample h3 {
    margin: 0 0 8px; font-size: 11px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--muted); font-weight: 600;
  }
  pre.code {
    margin: 0;
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--k-identifier);
    overflow-x: auto;
  }
  pre.code span { cursor: pointer; border-radius: 2px; }
  pre.code span:hover { outline: 1px solid currentColor; outline-offset: 1px; }

  .k-identifier  { color: var(--k-identifier); }
  .k-keyword     { color: var(--k-keyword); }
  .k-builtin     { color: var(--k-builtin); }
  .k-operator    { color: var(--k-operator); }
  .k-literal     { color: var(--k-literal); }
  .k-delimiter   { color: var(--k-delimiter); }
  .k-punctuation { color: var(--k-punctuation); }
  .k-string      { color: var(--k-string); }
  .k-comment     { color: var(--k-comment); }

  /* Chrome, as the video uses it: token chips, a framed group, a caption. */
  .chrome { margin-top: 30px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .chip {
    font-family: var(--mono); font-size: 12px; padding: 5px 9px;
    background: var(--surface); border: 1px solid var(--surface_stroke);
    border-radius: 6px; color: var(--k-identifier);
  }
  .frame {
    padding: 12px 16px; background: var(--frame);
    border: 1px solid var(--frame_stroke); border-radius: 9px;
    font-family: var(--mono); font-size: 12px; color: var(--k-identifier);
  }
  .caption { color: var(--muted); font-size: 12px; }
  .arrowbar { width: 74px; height: 2px; background: var(--subtle); }
  .danger { color: var(--danger); font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>canim theme editor</h1>
  <span class="note">
    samples lexed by canim &middot; click any token to jump to its color &middot;
    italic hex means derived from the background
  </span>
</header>

<div class="app">
  <aside class="controls">
    <!-- The control is a sibling of its label rather than nested inside it.
         A `select` inside a `label` gets the click twice — once itself, once
         forwarded by the label — so the menu opens and shuts in the same
         frame and the dropdown never appears. -->
    <div class="field">
      <label for="preset">preset</label>
      <select id="preset"></select>
    </div>
    <div class="field">
      <label for="name">name</label>
      <input type="text" id="name" value="my-theme">
    </div>

    <h2>background</h2>
    <div id="background-row"></div>

    <h2>tokens</h2>
    <div id="kind-rows"></div>

    <h2>chrome</h2>
    <div id="chrome-rows"></div>

    <div class="actions">
      <button class="action primary" id="copy">Copy theme</button>
      <button class="action" id="revert">Revert</button>
    </div>
    <textarea id="out" readonly spellcheck="false"></textarea>
  </aside>

  <main class="preview">
    <div class="stage" id="stage"></div>
  </main>
</div>

<script>
// Everything below lives in a function rather than at the top level of the
// script. A top-level `const` that happens to share a name with a property of
// `window` — `chrome`, `name`, `status`, `origin` — is a SyntaxError, and it
// takes the whole file down before a single line runs, so the page loads
// looking correct and nothing responds to anything.
(() => {
const DATA = /*__DATA__*/null;

const CHROME_DEFAULT_DANGER = "#e06c75";
const state = { background: null, colors: {}, chrome: {} };

// --- color helpers ------------------------------------------------------

function mix(a, b, t) {
  const pick = (s, i) => parseInt(s.slice(i, i + 2), 16);
  const to = (n) => Math.round(n).toString(16).padStart(2, "0");
  const [ar, ag, ab] = [1, 3, 5].map((i) => pick(a, i));
  const [br, bg, bb] = [1, 3, 5].map((i) => pick(b, i));
  return "#" + to(ar + (br - ar) * t) + to(ag + (bg - ag) * t) + to(ab + (bb - ab) * t);
}

/** What a chrome field resolves to: what was pinned, else the derivation. */
function chromeValue(field) {
  if (state.chrome[field]) return state.chrome[field];
  if (field === "danger") return CHROME_DEFAULT_DANGER;
  return mix(state.background, state.colors.identifier, DATA.derived[field]);
}

const CHROME_FIELDS = [...Object.keys(DATA.derived), "danger"];

// --- applying the theme -------------------------------------------------

function apply() {
  const root = document.documentElement.style;
  root.setProperty("--bg", state.background);
  for (const kind of DATA.kinds) root.setProperty(`--k-${kind}`, state.colors[kind]);
  for (const field of CHROME_FIELDS) root.setProperty(`--${field}`, chromeValue(field));
  refreshInputs();
  writeOutput();
}

function refreshInputs() {
  for (const row of document.querySelectorAll("[data-target]")) {
    const [group, key] = row.dataset.target.split(":");
    const value =
      group === "background" ? state.background
      : group === "colors" ? state.colors[key]
      : chromeValue(key);
    row.querySelector("input[type=color]").value = value;
    const hex = row.querySelector(".hex");
    if (document.activeElement !== hex) hex.value = value;
    const pinned = group !== "chrome" || Boolean(state.chrome[key]);
    hex.classList.toggle("derived", !pinned);
    row.classList.toggle("pinned", group === "chrome" && pinned);
  }
}

function set(group, key, value) {
  if (group === "background") state.background = value;
  else if (group === "colors") state.colors[key] = value;
  else state.chrome[key] = value;
  apply();
}

// --- the copyable form --------------------------------------------------

function writeOutput() {
  const name = document.getElementById("name").value.trim() || "my-theme";
  const pad = Math.max(...DATA.kinds.map((k) => k.length));
  const lines = [
    `${name.toUpperCase().replace(/[^A-Z0-9]+/g, "_")} = Theme(`,
    `    name=${JSON.stringify(name)},`,
    `    background=${JSON.stringify(state.background)},`,
    `    colors={`,
    ...DATA.kinds.map(
      (k) =>
        `        ${("Kind." + k.toUpperCase() + ":").padEnd(pad + 6)} ` +
        `${JSON.stringify(state.colors[k])},`
    ),
    `    },`,
  ];
  const pinned = CHROME_FIELDS.filter((f) => state.chrome[f]);
  for (const field of pinned) {
    lines.push(`    ${field}=${JSON.stringify(state.chrome[field])},`);
  }
  if (pinned.length < CHROME_FIELDS.length) {
    const derived = CHROME_FIELDS.filter((f) => !state.chrome[f]);
    lines.push(`    # derived: ${derived.join(", ")}`);
  }
  lines.push(")");
  document.getElementById("out").value = lines.join("\n");
}

// --- building the controls ----------------------------------------------

function row(group, key, label) {
  const el = document.createElement("div");
  el.className = "row";
  el.dataset.target = `${group}:${key}`;
  el.innerHTML =
    `<input type="color"><span class="name"></span>` +
    `<input class="hex" type="text" spellcheck="false">` +
    `<button class="reset" title="back to derived">&times;</button>`;
  el.querySelector(".name").textContent = label;

  // `input`, not `change`: this is what makes the page follow the cursor
  // around the picker instead of waiting for the mouse to come up.
  el.querySelector("input[type=color]").addEventListener("input", (e) =>
    set(group, key, e.target.value)
  );
  el.querySelector(".hex").addEventListener("input", (e) => {
    const value = e.target.value.trim();
    if (/^#[0-9a-fA-F]{6}$/.test(value)) set(group, key, value.toLowerCase());
  });
  el.querySelector(".reset").addEventListener("click", () => {
    delete state.chrome[key];
    apply();
  });
  return el;
}

document.getElementById("background-row").append(row("background", "background", "background"));
for (const kind of DATA.kinds) {
  document.getElementById("kind-rows").append(row("colors", kind, kind));
}
for (const field of CHROME_FIELDS) {
  document.getElementById("chrome-rows").append(row("chrome", field, field));
}

// --- the preview --------------------------------------------------------

const stage = document.getElementById("stage");
for (const sample of DATA.samples) {
  const block = document.createElement("div");
  block.className = "sample";
  const heading = document.createElement("h3");
  heading.textContent = sample.name;
  const pre = document.createElement("pre");
  pre.className = "code";
  for (const seg of sample.segments) {
    if (seg.kind === null) {
      pre.append(document.createTextNode(seg.text));
      continue;
    }
    const span = document.createElement("span");
    span.className = `k-${seg.kind}`;
    span.textContent = seg.text;
    span.title = seg.kind;
    // Clicking a token is the fastest way to find the control for it.
    span.addEventListener("click", () => {
      const target = document.querySelector(`[data-target="colors:${seg.kind}"]`);
      target.scrollIntoView({ block: "center", behavior: "smooth" });
      target.classList.add("hit");
      setTimeout(() => target.classList.remove("hit"), 1200);
    });
    pre.append(span);
  }
  block.append(heading, pre);
  stage.append(block);
}

const chromeStrip = document.createElement("div");
chromeStrip.className = "chrome";
chromeStrip.innerHTML =
  `<span class="chip">defmacro</span><span class="chip">swap</span>` +
  `<span class="arrowbar"></span>` +
  `<span class="frame">Lisp compiler</span>` +
  `<span class="caption">a caption, in muted</span>` +
  `<span class="danger">&times; the bad option</span>`;
stage.append(chromeStrip);

// --- presets ------------------------------------------------------------

const presets = document.getElementById("preset");
for (const name of Object.keys(DATA.presets)) {
  const option = document.createElement("option");
  option.value = name;
  option.textContent = name;
  presets.append(option);
}

function load(name) {
  const preset = DATA.presets[name];
  state.background = preset.background;
  state.colors = { ...preset.colors };
  state.chrome = { ...preset.chrome };
  document.getElementById("name").value = name;
  apply();
}

presets.addEventListener("change", (e) => load(e.target.value));
document.getElementById("name").addEventListener("input", writeOutput);
document.getElementById("revert").addEventListener("click", () => load(presets.value));
document.getElementById("copy").addEventListener("click", async (e) => {
  await navigator.clipboard.writeText(document.getElementById("out").value);
  e.target.textContent = "Copied";
  setTimeout(() => (e.target.textContent = "Copy theme"), 1200);
});

load(presets.value);
})();
</script>
</body>
</html>
