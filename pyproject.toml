[project]
name = "canim"
version = "0.1.0"
description = "Code transformation animations for manim"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Michael Delmonaco" }]
# Upper bound is real, not caution. On 3.13 two things break independently:
# ManimPango 0.5.0 has no wheel and fails to build from source, and pydub
# imports `audioop`, which was removed from the stdlib in 3.13.
requires-python = ">=3.12,<3.13"
dependencies = ["manim==0.19.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
canim-theme-editor = "canim.theme_editor.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canim*"]

# Neither of these is a Python file, and neither is optional. The themes are
# what `theme.open("one-dark")` reads, and the editor is a web app served off
# disk — an install missing them imports fine and then fails at the first call
# that needs one. Verify with `python -m build` and look inside the wheel,
# not with an editable install, which sees the source tree either way.
[tool.setuptools.package-data]
canim = ["themes/*.theme.json"]
"canim.theme_editor" = ["app/**/*"]
